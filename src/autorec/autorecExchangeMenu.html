<div class="bbc-exchange-modal">
    <header class="bbc-exchange-header">
        <h3 class="bbc-exchange-title">
            <i class="fa-solid fa-file-import"></i>
            {{localize "BBC.settings.autorecExchangeMenu.heading"}}
        </h3>
        <p class="bbc-exchange-desc">
            {{localize "BBC.settings.autorecExchangeMenu.desc"}}
        </p>
        <span class="bbc-exchange-badge">{{countMsg}}</span>
    </header>

    <div class="bbc-exchange-actions">
        <button type="button" class="bbc-exchange-btn bbc-exchange-btn-export bbc-setting-export-btn">
            <i class="fa-solid fa-file-export"></i>
            {{localize "BBC.settings.autorecExchangeMenu.exportBtn"}}
        </button>
        <button type="button" class="bbc-exchange-btn bbc-exchange-btn-import bbc-setting-import-btn">
            <i class="fa-solid fa-file-import"></i>
            {{localize "BBC.settings.autorecExchangeMenu.importBtn"}}
        </button>
    </div>
</div>
