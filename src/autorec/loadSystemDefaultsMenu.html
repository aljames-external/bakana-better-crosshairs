<div class="bbc-exchange-modal">
    <header class="bbc-exchange-header">
        <h3 class="bbc-exchange-title">
            <i class="fa-solid fa-arrows-rotate"></i>
            {{localize "BBC.settings.loadSystemDefaults.name"}}
        </h3>
        <p class="bbc-exchange-desc">
            {{desc}}
        </p>
    </header>

    <div class="bbc-exchange-actions">
        <button type="button" class="bbc-exchange-btn bbc-load-defaults-cancel-btn">
            <i class="fa-solid fa-xmark"></i>
            {{localize "Cancel"}}
        </button>
        <button type="button" class="bbc-exchange-btn bbc-exchange-btn-import bbc-load-defaults-confirm-btn">
            <i class="fa-solid fa-arrows-rotate"></i>
            {{localize "BBC.settings.loadSystemDefaults.label"}}
        </button>
    </div>
</div>
