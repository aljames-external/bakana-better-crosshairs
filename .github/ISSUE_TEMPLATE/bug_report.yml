name: Bug Report
description: Report a bug or unexpected behavior with targeting crosshairs or automated recognition.
title: "[Bug]: <Short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug with Bakana's Better Crosshairs! Please fill out the form below to help us reproduce and fix the issue.

  - type: input
    id: system
    attributes:
      label: Game System & Version
      description: What game system are you running, and what is its version?
      placeholder: e.g., dnd5e v4.1.2 or pf2e v6.1.2
    validations:
      required: true

  - type: input
    id: foundry_version
    attributes:
      label: Foundry VTT Version
      description: Which version and build of Foundry VTT are you using?
      placeholder: e.g., V12 Build 331 or V14 Build 341
    validations:
      required: true

  - type: textarea
    id: active_modules
    attributes:
      label: Relevant Active Modules
      description: List any active modules that might interact with templates, targeting, or workflow automation (especially Sequencer, Midi-QOL, etc.).
      placeholder: e.g., sequencer v3.3.0, midi-qol v11.4.25, etc.
    validations:
      required: true

  - type: dropdown
    id: troubleshooting
    attributes:
      label: Basic Troubleshooting
      description: Have you tried testing with only Sequencer and Bakana's Better Crosshairs active to see if the issue persists?
      options:
        - "Yes, and the bug still occurs in a clean environment"
        - "No, I cannot disable other modules right now"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is and what you expected to happen (e.g., crosshair rotation, template placement coordinates, Autorec matching).
      placeholder: Describe what is happening...
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Explain exactly how we can reproduce the bug, step-by-step.
      placeholder: |
        1. Create an Autorec entry for...
        2. Cast item...
        3. Observe crosshair preview...
        4. Left click to place...
    validations:
      required: true

  - type: textarea
    id: console_errors
    attributes:
      label: Console Errors / Logs
      description: If applicable, press F12, open the console, and paste any red error logs or '[bakana-better-crosshairs]' debug logs here.
      placeholder: Paste console errors or BBC trace logs here...
    validations:
      required: false
