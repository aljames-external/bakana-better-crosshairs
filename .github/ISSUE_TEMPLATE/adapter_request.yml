name: System / Module Adapter Request
description: Request support for a new game system or third-party module integration.
title: "[Adapter Request]: <System/Module Name>"
labels: ["adapter-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for requesting an adapter! Supporting new game systems and workflow modules is a key goal of Bakana's Better Crosshairs.
        
        To help us build this adapter, please fill out the details below. We will likely need to inspect item/activity data structures with you, so providing a contact method is highly appreciated.
  
  - type: input
    id: system_name
    attributes:
      label: System / Module Name
      description: What game system (e.g., Lancer, Savage Worlds) or workflow module (e.g., Level Up 5e) are you requesting support for?
      placeholder: e.g., Pathfinder 2e (system) or Ready Up (module)
    validations:
      required: true

  - type: input
    id: discord_handle
    attributes:
      label: Discord Handle
      description: We will likely need to discuss corner cases, item flags, or template workflows with you. Please provide your Discord handle.
      placeholder: e.g., username#0000 or username
    validations:
      required: true

  - type: textarea
    id: item_json
    attributes:
      label: Item / Activity / Workflow JSON Exports
      description: |
        Please export one or more items/spells from your system as JSON and paste their contents here, or attach the `.json` files directly.
        
        **Important**: Please highlight how template placement or activity targeting is triggered in this system/module.
      placeholder: Paste JSON content or drag-and-drop .json files here...
    validations:
      required: true

  - type: textarea
    id: additional_features
    attributes:
      label: Additional System-Specific Targeting Features
      description: Describe any special targeting mechanics for this system (e.g., custom template shapes, special area rules, cone angle conventions).
      placeholder: e.g., "In this system cones use a 90-degree angle..."
    validations:
      required: false
